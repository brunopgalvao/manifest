<!doctype html><html><head><meta charset="utf-8"><title>Warehouse</title>
<style>body{margin:0;font:14px system-ui,sans-serif;color:#1a1a1a}.wrap{padding:16px;width:688px}h2{font-size:17px;margin:0 0 12px}svg text{font-family:system-ui,sans-serif}</style></head>
<body><div class="wrap">
<h2>Warehouse, floor 2</h2>
<svg width="640" height="360" viewBox="0 0 640 360" role="img" aria-label="Floor plan of warehouse floor 2">
<rect x="0" y="0" width="640" height="360" fill="#f7f8f9" stroke="#e2e5ea"/>
<g role="region" aria-label="Receiving" transform="translate(20 20)"><rect width="200" height="120" rx="6" fill="#cfeef3"/><text x="12" y="24" font-size="13" font-weight="600">Receiving</text>
<rect x="20" y="50" width="40" height="40" rx="4" fill="#0b7285" role="img" aria-label="Dock A"/><rect x="80" y="50" width="40" height="40" rx="4" fill="#0b7285" role="img" aria-label="Dock B"/><rect x="140" y="50" width="40" height="40" rx="4" fill="#8a5900" role="img" aria-label="Dock C, occupied"/></g>
<g role="region" aria-label="Storage" transform="translate(240 20)"><rect width="380" height="200" rx="6" fill="#dcdfe3"/><text x="12" y="24" font-size="13" font-weight="600">Storage</text>
<rect x="20" y="40" width="100" height="60" fill="#fff" stroke="#e2e5ea" role="img" aria-label="Aisle 1"/><rect x="140" y="40" width="100" height="60" fill="#fff" stroke="#e2e5ea" role="img" aria-label="Aisle 2"/><rect x="260" y="40" width="100" height="60" fill="#fff" stroke="#e2e5ea" role="img" aria-label="Aisle 3"/>
<rect x="20" y="120" width="100" height="60" fill="#fff" stroke="#e2e5ea" role="img" aria-label="Aisle 4"/><rect x="140" y="120" width="100" height="60" fill="#fff" stroke="#e2e5ea" role="img" aria-label="Aisle 5"/><rect x="260" y="120" width="100" height="60" fill="#e8bcbc" stroke="#c62a2a" role="img" aria-label="Aisle 6, blocked"/></g>
<g role="region" aria-label="Shipping" transform="translate(20 240)"><rect width="600" height="100" rx="6" fill="#c9e8d3"/><text x="12" y="24" font-size="13" font-weight="600">Shipping</text>
<circle cx="80" cy="60" r="14" fill="#156e3b" role="img" aria-label="Truck 1, loading"/><circle cx="140" cy="60" r="14" fill="#5d646e" role="img" aria-label="Truck 2, waiting"/></g>
<g role="button" tabindex="0" aria-label="Locate pallet" transform="translate(500 10)"><rect width="120" height="28" rx="14" fill="#2f5bea"/><text x="60" y="18" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">Locate pallet</text></g>
</svg></div></body></html>
