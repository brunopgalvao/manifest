<!doctype html><html><head><meta charset="utf-8"><title>Request path</title>
<style>body{margin:0;font:14px system-ui,sans-serif;color:#1a1a1a}.wrap{padding:16px;width:688px}h2{font-size:17px;margin:0 0 12px}svg text{font-family:system-ui,sans-serif}</style></head>
<body><div class="wrap">
<h2>Request path</h2>
<svg width="640" height="260" viewBox="0 0 640 260" role="img" aria-label="Request path: Client to Edge over HTTPS; Edge to API on a cache miss or to Cache on a hit; API to Database; API fills the Cache">
<g role="listitem" aria-label="Client" transform="translate(20 100)"><rect width="120" height="56" rx="8" fill="#d5defb" stroke="#2f5bea"/><text x="60" y="33" text-anchor="middle" font-size="13">Client</text></g>
<g role="listitem" aria-label="Edge" transform="translate(200 100)"><rect width="120" height="56" rx="8" fill="#d5defb" stroke="#2f5bea"/><text x="60" y="33" text-anchor="middle" font-size="13">Edge</text></g>
<g role="listitem" aria-label="API" transform="translate(380 30)"><rect width="120" height="56" rx="8" fill="#d5defb" stroke="#2f5bea"/><text x="60" y="33" text-anchor="middle" font-size="13">API</text></g>
<g role="listitem" aria-label="Cache" transform="translate(380 170)"><rect width="120" height="56" rx="8" fill="#d0e2d8" stroke="#156e3b"/><text x="60" y="33" text-anchor="middle" font-size="13">Cache</text></g>
<g role="listitem" aria-label="Database" transform="translate(540 30)"><rect width="90" height="56" rx="8" fill="#e8ddcc" stroke="#8a5900"/><text x="45" y="33" text-anchor="middle" font-size="13">Database</text></g>
<path d="M 140 128 L 200 128" stroke="#545a63" stroke-width="1.5" fill="none"/><text x="170" y="120" text-anchor="middle" font-size="11" fill="#545a63">HTTPS</text>
<path d="M 320 118 C 350 118 350 58 380 58" stroke="#545a63" stroke-width="1.5" fill="none"/><text x="350" y="80" text-anchor="middle" font-size="11" fill="#545a63">miss</text>
<path d="M 320 138 C 350 138 350 198 380 198" stroke="#545a63" stroke-width="1.5" fill="none"/><text x="350" y="178" text-anchor="middle" font-size="11" fill="#545a63">hit</text>
<path d="M 500 58 L 540 58" stroke="#545a63" stroke-width="1.5" fill="none"/>
<path d="M 440 86 L 440 170" stroke="#545a63" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/><text x="452" y="130" font-size="11" fill="#545a63">fill</text>
</svg></div></body></html>
