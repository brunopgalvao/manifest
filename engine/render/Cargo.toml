[package]
name = "mx-render"
description = "Manifest renderer in Rust: layout with taffy, rasterization with tiny-skia, perception from the engine's own boxes."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ab_glyph = "0.2.32"
mx = { path = "../mx" }
serde_json = "1.0.154"
taffy = "0.15.0"
tiny-skia = "0.12.0"
