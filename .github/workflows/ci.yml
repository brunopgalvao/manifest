name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - run: cargo test --release
        working-directory: engine
      - run: cargo build --release --target wasm32-unknown-unknown -p mx-render
        working-directory: engine
      - uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: engine/target/wasm32-unknown-unknown/release/mx_render.wasm
  import:
    runs-on: ubuntu-latest
    needs: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wasm
          path: engine/target/wasm32-unknown-unknown/release
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: import
      - run: npx playwright install --with-deps chromium
        working-directory: import
      - run: npm test
        working-directory: import
